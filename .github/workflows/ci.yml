name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          sed -i 's|registry\.npmmirror\.com|registry.npmjs.org|g' package-lock.json
          npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Lint, typecheck and build
        run: npm run test:quality
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 7

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Verify backend
        working-directory: backend
        run: mvn -B verify

  integration:
    name: MySQL 5.7 integration and concurrency
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: pms_xkzoom
          MYSQL_USER: pms_app
          MYSQL_PASSWORD: Pms@App2026Secure
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install MySQL client and Node dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          sed -i 's|registry\.npmmirror\.com|registry.npmjs.org|g' package-lock.json
          npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Start backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_APP_USER: pms_app
          DB_APP_PASSWORD: Pms@App2026Secure
          JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
          PMS_CHANNEL_SECRET_KEY: ci-channel-secret-with-at-least-thirty-two-characters
        run: |
          cd backend
          nohup mvn -B spring-boot:run > ../backend-ci.log 2>&1 &
          echo $! > ../backend-ci.pid
          cd ..
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8090/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend-ci.log
          exit 1
      - name: Run API and invariant smoke tests
        run: |
          npm run test:api
          npm run test:tenant
          npm run test:booking-concurrency
          npm run test:security
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-log
          path: backend-ci.log
          retention-days: 7

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t minsu-pms-backend:ci backend
      - name: Build frontend image
        run: docker build -t minsu-pms-frontend:ci .

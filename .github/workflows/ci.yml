name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一个 PR/branch 只跑最新一次，取消旧的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          # 如果未来用了私有 npm 包，从 secret 注入 token
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_CONFIG_TOKEN }}
        run: |
          # 本地 lockfile 指向 npmmirror.com 镜像，CI 海外 runner 访问超时。
          # 强制替换为 npmjs.org 官方源，保证 CI 能拉到依赖。
          # --legacy-peer-deps 绕过 eslint@9 + @typescript-eslint@7 的 ERESOLVE 冲突。
          sed -i 's|registry\.npmmirror\.com|registry.npmjs.org|g' package-lock.json
          npm ci --legacy-peer-deps --no-audit --no-fund

      # 跳过 Type-check：项目用单一 tsconfig.json，vite build 已包含类型检查
      # 跳过 Lint：项目根暂无 .eslintrc 配置文件，留着会失败（且 ESLint v9 flat config 需 .mjs/eslint.config.js）

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node }}
          path: dist
          retention-days: 7

  backend:
    name: Backend (JDK 17)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: pms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven

      - name: Verify MySQL is up
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null; then
              echo "MySQL port 3306 ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run tests
        working-directory: backend
        run: mvn -B test -DfailIfNoTests=false
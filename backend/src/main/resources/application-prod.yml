spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    locations: classpath:db/migration
    baseline-version: 1

pms:
  jwt:
    secret: ${JWT_SECRET}
    expires-hours: ${JWT_EXPIRES_HOURS:8}
    header: Authorization
    prefix: "Bearer "
  cors:
    allowed-origins: ${PMS_ALLOWED_ORIGINS}
  secrets:
    channel-key: ${PMS_CHANNEL_SECRET_KEY}

server:
  port: ${SERVER_PORT:8090}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: INFO
    com.xkzoom.pms: INFO
